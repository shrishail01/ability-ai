<html lang="en">

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>Aibility — AI-First Software Company | Web, Mobile & AI Development</title>

  <meta name="robots" content="index, follow" />
  <meta name="author" content="Aibility" />
  <meta name="theme-color" content="#0066FF" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aibility.ai/" />
  <meta property="og:title" content="Aibility — AI-First Software Company" />
  <meta property="og:description" content="We design and develop AI-first websites, mobile apps, SaaS platforms, and enterprise software that transform businesses." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Twitter -->

  <meta property="twitter:image" content="/og-image.png" />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "Aibility",
      "url": "https://aibility.ai",

      "address": {
        "@type": "PostalAddress",
        "addressLocality": "San Francisco",
        "addressRegion": "CA",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-234-567-890",
        "contactType": "sales",
        "email": "hello@aibility.ai"
      },
      "sameAs": [
        "https://twitter.com/aibility",
        "https://linkedin.com/company/aibility",
        "https://github.com/aibility"
      ]
    }

</head>
